    <script type="application/ld+json">

        "@context": "https://schema.org",

          {
            "@type": "Organization",
            "@id": "https://korvenzatech.com/#organization",
            "name": "KorvenzaTech",
            "url": "https://korvenzatech.com/",
            "logo": "https://korvenzatech.com/korvenza-logo.png",
            "founder": {
              "@type": "Person",
              "name": "Muhammad Rashid",
              "jobTitle": "Founder & CEO"
            },
            "description": "KorvenzaTech is a software development company that designs and builds custom software, SaaS platforms, mobile apps, AI solutions, websites, APIs and cloud-ready systems.",
            "areaServed": "Worldwide",
            "contactPoint": [
              {"@type":"ContactPoint","contactType":"customer service","email":"info@korvenzatech.com","telephone":"+92-370-1691701"},
              {"@type":"ContactPoint","contactType":"sales","email":"sales@korvenzatech.com","telephone":"+92-370-1691701"}
            ]

          {
            "@type": "WebSite",
            "@id": "https://korvenzatech.com/#website",

            "name": "KorvenzaTech",

            }
          }
        ]
      }
    </script>

    <title>
      KorvenzaTech | Software Development, AI, SaaS, Mobile & Web
    </title>

    <script>
      (function(){
        try {
          var saved = localStorage.getItem('korvenza-theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (_) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
